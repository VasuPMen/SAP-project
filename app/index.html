<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAP Fiori Launchpad - Rental Equipment Tracking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="/fiori-auth.js"></script>
    <script>
        (function () {
            const urlParams = new URLSearchParams(window.location.search);
            const currentAppId = urlParams.get('app');
            const APP_REGISTRY = {
                'customer-management': { title: 'Customer Management', ns: 'retcl.customermanagement', path: '/customer-management/webapp' },
                'damage-charge-approval': { title: 'Damage Record', ns: 'retcl.damagechargeapproval', path: '/damage-charge-approval/webapp' },
                'fleet-overview': { title: 'Fleet Overview & Asset Detail', ns: 'retcl.fleetoverview', path: '/fleet-overview/webapp' },
                'inspections': { title: 'Equipment Inspections', ns: 'retcl.inspections', path: '/inspections/webapp' },
                'locations': { title: 'Depot & Yard Locations', ns: 'retcl.locations', path: '/locations/webapp' },
                'maintenance-planner': { title: 'Maintenance Planner & Schedules', ns: 'retcl.maintenanceplanner', path: '/maintenance-planner/webapp' },
                'rentals': { title: 'Rental Contracts & Allocations', ns: 'retcl.rentals', path: '/rentals/webapp' },
                'repair-jobs': { title: 'Workshop Repair Jobs', ns: 'retcl.repairjobs', path: '/repair-jobs/webapp' }
            };
            const appCfg = currentAppId ? APP_REGISTRY[currentAppId] : null;
            window.__FIORI_APP_CONFIG = appCfg;
            window.__FIORI_CURRENT_APP_ID = currentAppId;

            if (appCfg) {
                document.title = appCfg.title;
                const resRoots = JSON.stringify({ [appCfg.ns]: appCfg.path });
                document.write(
                    '<script ' +
                    'id="sap-ui-bootstrap" ' +
                    'src="https://ui5.sap.com/resources/sap-ui-core.js" ' +
                    'data-sap-ui-theme="sap_horizon" ' +
                    'data-sap-ui-resourceroots=\'' + resRoots + '\' ' +
                    'data-sap-ui-onInit="module:sap/ui/core/ComponentSupport" ' +
                    'data-sap-ui-compatVersion="edge" ' +
                    'data-sap-ui-async="true" ' +
                    'data-sap-ui-frameOptions="trusted">' +
                    '<\/script>'
                );
            } else {
                document.write(
                    '<script ' +
                    'id="sap-ui-bootstrap" ' +
                    'src="https://ui5.sap.com/resources/sap-ui-core.js" ' +
                    'data-sap-ui-theme="sap_horizon" ' +
                    'data-sap-ui-libs="sap.m" ' +
                    'data-sap-ui-compatVersion="edge" ' +
                    'data-sap-ui-async="true" ' +
                    'data-sap-ui-frameOptions="trusted">' +
                    '<\/script>'
                );
            }
        })();
    </script>
    <link rel="stylesheet" href="/index.css">
</head>

<body class="sapUiBody sapUiSizeCompact">
    <script>
        if (window.__FIORI_APP_CONFIG) {
            document.body.classList.add('fiori-subapp-mode', 'sapUiBody', 'sapUiSizeCompact');
            initSubAppGuard(window.__FIORI_CURRENT_APP_ID, window.__FIORI_APP_CONFIG.title);
            document.write(
                '<div data-sap-ui-component ' +
                'data-name="' + window.__FIORI_APP_CONFIG.ns + '" ' +
                'data-id="container" ' +
                'data-settings=\'{"id" : "' + window.__FIORI_APP_CONFIG.ns + '"}\' ' +
                'style="height: calc(100vh - 42px); width: 100%;">' +
                '</div>'
            );
        }
    </script>

    <!-- SAP FIORI LAUNCHPAD -->
    <div id="launchpad-view">

        <header class="fiori-shell">
            <div class="shell-brand">
                <svg class="sap-logo" viewBox="0 0 72 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="72" height="36" rx="4" fill="#0070F2" />
                    <text x="36" y="25" fill="#FFFFFF" font-family="'72', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="19" text-anchor="middle" letter-spacing="1.2">SAP</text>
                </svg>
                <div class="shell-divider"></div>
                <div class="shell-title-group">
                    <span class="shell-title-main">Rental Equipment Tracking & Condition Logging</span>
                    <span class="shell-title-sub">Enterprise Yard Management Portal</span>
                </div>
            </div>

            <div class="shell-actions">
                <div class="user-capsule" id="shell-user-capsule" style="opacity: 0; transition: opacity 0.2s;">
                    <span class="user-avatar" id="shell-user-avatar">US</span>
                    <div class="user-details">
                        <span class="user-name" id="shell-user-name">User</span>
                        <span class="user-role-tag" id="shell-user-role">Role</span>
                    </div>
                </div>

                <button class="btn-shell" onclick="handleLogout()" title="Log out" id="shell-logout-btn">
                    <span class="btn-shell-icon">&#x21AA;</span>
                    <span class="btn-shell-text">Sign Out</span>
                </button>
            </div>
        </header>

        <main class="launchpad-container">

            <!-- Role-Tailored KPI Banner (SAP Fiori GenericTiles) -->
            <div class="kpi-section-header" id="kpi-section-header" style="display: none;">
                <h2 class="kpi-section-title">
                    <span>Key Performance Indicators</span>
                    <span class="kpi-badge">Real-Time Telemetry</span>
                </h2>
            </div>
            <section class="kpi-banner" id="kpi-banner"></section>

            <!-- ALL APPLICATIONS DIRECTORY -->
            <div class="kpi-section-header" style="margin-top: 1.5rem; margin-bottom: 0.85rem;">
                <h2 class="kpi-section-title">
                    <span>Business Applications</span>
                    <span class="kpi-badge">Authorized Modules</span>
                </h2>
            </div>
            <section class="tile-group" id="group-apps">
                <div class="tiles-grid" id="apps-tiles-grid"></div>
            </section>
        </main>
    </div>

    <!-- CORE JAVASCRIPT -->
    <script src="/index.js" defer></script>
</body>
</html>
